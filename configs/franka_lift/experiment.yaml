# Experiment metadata
experiment_name: franka_lift
run_name: ""  # Optional suffix for log directory
logger: wandb  # wandb | noop

seed: 42
max_iterations: 1500

# Environment (Isaac Lab task)
env:
  name: Isaac-Lift-Cube-Franka-v0
  device: cuda:0
  num_envs: 4096
  headless: true
  # Object-to-goal distance (m) below which a Lift step counts as success.
  # Calibrated for the upstream Franka-Lift PPO (object_goal_tracking uses
  # std=0.3, so the policy typically converges to ~5-10cm residual error;
  # 0.08m is loose enough to actually register but still meaningful).
  success_threshold: 0.08
  # Inject a `success_bonus` reward term (binary `object_reached_goal`) into
  # the env's RewardsCfg as an IRL FEATURE ONLY (env-reward weight = 0).
  # The reward model still learns its weight alongside the other features —
  # set success_bonus_weight > 0 if you also want it to enter the env reward.
  add_success_bonus: true
  success_bonus_weight: 0.0

# Feature map: extracts features from env for reward learning
feature_map:
  ignored_reward_terms: []  # Reward term names to exclude from features (e.g. ["reach"])

# Learned reward model (dense = MLP, linear = w^T x)
reward:
  type: linear  # dense | linear
  hidden_dims: [256, 128, 64]  # MLP layers (ignored when type: linear)
  activation: elu
  is_linear: true
  # Regularization: none | l2 (typical for dense) | l1 | elastic
  regularization: l2
  regularization_strength: 1.0e-4
  elastic_alpha: 0.5  # L1 fraction when regularization: elastic
  # Linear-only: projection onto norm ball after optimizer step (none | l1_ball | l2_ball)
  linear_projection: l2_ball
  linear_projection_radius: 1.0

# Policy (actor-critic) architecture
policy:
  type: mlp
  actor_hidden_dims: [256, 128, 64]
  critic_hidden_dims: [256, 128, 64]
  activation: elu

# Policy update. Public choices are ppo | sac | pmd.
# SAC and PMD additionally accept:
#   train: {gamma, rollout_steps, updates_per_transition, ...}
#   policy: {hidden_dims, initial_std, minimum_std, action_bound}
#   value: {type: direct | successor, num_heads, ...}
# PMD's nonparametric update is
#   pi_target(a|s) proportional to pi_old(a|s)^beta * exp(c * Q(s,a)).
# beta=1 keeps the mirror-descent prior; beta=0 uses the SAC/Boltzmann target.
# See docs/rl_algorithms.md for every off-policy hyperparameter.
algo:
  type: ppo
  learning_rate: 1.0e-4
  gamma: 0.98  # Discount factor
  lam: 0.95  # GAE lambda
  num_learning_epochs: 5
  num_mini_batches: 4

# IRL reward learning
irl:
  expert_data_path: ""  # Required path to expert demos (.pt or .h5); CLI --expert_data_path usually sets this
  expert_num_trajectories: null  # null = use all; int = subset for ablations (e.g. 50)
  expert_subset_strategy: first  # first | random (random uses experiment seed)
  batch_size: 256
  num_learning_epochs: 1
  weight_decay: 1.0e-6
  max_grad_norm: 1.0
  reward_loss_coef: 1.0
  reward_learning_rate: 1e-4
  discount_gamma: null  # null = use algo.gamma for IRL returns
  # Off by default now that imitator episodes are collected as full
  # trajectories (matched to expert demo length) — dividing by the (now nearly
  # constant) length is a no-op scale factor that just muddies the gradient.
  # Re-enable only if you collect imitator episodes of meaningfully different
  # lengths than the expert demos.
  normalize_returns_by_episode_length: false
# Runner / training loop
runner:
  # If true (recommended), the agent is trained against the learned reward model.
  # If false, it trains against the env's GT reward and the reward model is fit
  # alongside as a diagnostic baseline.
  use_learned_reward: true
  steps_per_env_per_cycle: 24  # Env steps per env per iteration
  save_interval: 50  # Checkpoint every N iterations
  rl_updates_per_cycle: 1
  reward_updates_per_cycle: 1
  expert_num_envs: 1  # Parallel envs for expert rollout (when expert_data_path set)
  validation_interval: 50  # Run stochastic + inference validation every N iterations; 0 disables
  validation_steps_per_env: null  # null = 5 * steps_per_env_per_cycle; 0 disables
  # Dedicated full-trajectory imitator rollout (filled into the IRL buffer
  # between reward updates). null = use env.max_episode_length so each env
  # produces ~1 full episode per IRL cycle, matching expert demo length.
  imitator_rollout_steps_per_env: null
  imitator_buffer:
    capacity_steps: 1000000
    store_device: cpu
    store_dtype: float32
    min_ep_len: 2  # Min episode length to store
    sample_weighted_by_length: true
  expert_buffer:
    capacity_steps: 1000000
    store_device: cpu
    store_dtype: float32
    min_ep_len: 1
    sample_weighted_by_length: true

# Behavioral cloning auxiliary loss
# When weight > 0, L_actor=(1-weight)*L_RL + weight*L_BC.
# Requires irl.expert_data_path to point at an HDF5 with (obs, actions) demos
# (same file as IRL features). weight=0 constructs no BC loader or gradient.
bc:
  weight: 0.0          # 0 = RL only, 1 = BC only
  loss_type: nll       # "nll" | "mse"
  batch_size: 256
  val_fraction: 0.1    # >0 holds out that fraction of demo episodes for BC/val_loss
